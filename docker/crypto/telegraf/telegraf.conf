[agent]
  interval = "10s"
  round_interval = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]

  topics = [
    "crypto/+/price",
    "crypto/+/market_cap",
    "crypto/+/volume"
  ]

  qos = 0
  connection_timeout = "30s"
  topic_tag = "topic"

  data_format = "value"
  data_type = "float"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]

  token = "crypto-token-12345"
  organization = "crypto"
  bucket = "cryptodata"
